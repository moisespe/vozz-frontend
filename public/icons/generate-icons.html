<!DOCTYPE html>
<html><body><canvas id="c" width="512" height="512"></canvas>
<script>
const c = document.getElementById('c'), ctx = c.getContext('2d')

function draw(size) {
  const s = size / 512
  ctx.clearRect(0, 0, size, size)

  // Fondo redondeado
  ctx.fillStyle = '#000000'
  ctx.beginPath()
  ctx.roundRect(0, 0, size, size, size * 0.16)
  ctx.fill()

  // Icono de micrófono
  ctx.fillStyle = '#fff'
  ctx.save()
  ctx.translate(size * 0.25, size * 0.2)
  ctx.scale(s * 0.5, s * 0.5)
  ctx.beginPath()
  ctx.arc(256, 150, 80, 0, Math.PI * 2)
  ctx.fill()
  ctx.fillRect(180, 230, 152, 80)
  ctx.beginPath()
  ctx.arc(256, 320, 100, Math.PI, 0)
  ctx.fill()
  ctx.fillRect(220, 350, 72, 80)
  ctx.restore()

  // Texto VOZZ
  ctx.fillStyle = '#fff'
  ctx.font = `bold ${size * 0.12}px sans-serif`
  ctx.textAlign = 'center'
  ctx.fillText('VOZZ', size / 2, size * 0.88)

  const link = document.createElement('a')
  link.download = size === 192 ? 'icon-192.png' : 'icon-512.png'
  link.href = c.toDataURL('image/png')
  link.click()
}

draw(192)
draw(512)
document.body.innerHTML = '<p>Iconos generados. Revisa tu carpeta de descargas.</p>'
</script></body></html>
